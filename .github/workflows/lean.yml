name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Correct arbitrary-depth wording
        if: github.ref == 'refs/heads/work/alignment-reconstruction'
        shell: bash
        run: |
          python3 scripts/fix-depth-wording.py
          python3 scripts/fix-depth-wording-residual.py
          rm scripts/fix-depth-wording.py scripts/fix-depth-wording-residual.py
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/lean.yml > .github/workflows/lean.yml
          git show FETCH_HEAD:scripts/verify-manifest.sh > scripts/verify-manifest.sh
          git diff --check
          git config user.name 'John Doe'
          git config user.email 'Dissociation@outlook.fr'
          git add -A
          git commit -m 'docs: clarify arbitrary natural depth'
          git push origin HEAD:work/alignment-reconstruction

      - name: Build Lean project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0

      - name: Build regression library
        run: lake build AuditRegression

      - name: Verify scientific-file manifest
        run: bash scripts/verify-manifest.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Lean project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0

      - name: Build regression library
        shell: pwsh
        run: '& "$HOME\.elan\bin\lake.exe" build AuditRegression'

      - name: Verify manifest with PowerShell
        shell: pwsh
        run: ./scripts/verify-manifest.ps1

      - name: Verify manifest with Windows PowerShell
        shell: powershell
        run: ./scripts/verify-manifest.ps1
