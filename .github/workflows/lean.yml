name: Lean verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Integrate alignment documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/update-alignment-docs.py')
          text = path.read_text(encoding='utf-8')
          old = 'for counterexamples showing that exactness alone does not imply coherence'
          new = 'for counterexamples showing that exactness alone is insufficient for coherence'
          if text.count(old) != 1:
              raise SystemExit('expected English positioning anchor not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/update-alignment-docs.py
          rm scripts/update-alignment-docs.py
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/lean.yml > .github/workflows/lean.yml
          git diff --check
          git config user.name 'John Doe'
          git config user.email 'Dissociation@outlook.fr'
          git add -A
          git commit -m 'docs: integrate alignment reconstruction'
          git push origin HEAD:work/alignment-reconstruction

      - name: Build Lean project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0

      - name: Build regression library
        run: lake build AuditRegression

      - name: Verify scientific-file manifest
        run: bash scripts/verify-manifest.sh
