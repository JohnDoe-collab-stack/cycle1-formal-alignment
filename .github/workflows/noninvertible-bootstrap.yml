name: Prepare constitutive amplification toolchain

on:
  push:
    branches: [research/noninvertible-constitutive-amplification]
    paths: [.github/workflows/noninvertible-bootstrap.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audited baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build pinned Lean baseline
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
      - name: Package public compiler and checked source workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/constitutive-bootstrap /tmp/constitutive-chunks
          lean --version | tee /tmp/constitutive-bootstrap/lean-version.txt
          git rev-parse HEAD | tee /tmp/constitutive-bootstrap/commit.txt
          prefix="$(lean --print-prefix)"
          tar --zstd -cf /tmp/constitutive-bootstrap/toolchain.tar.zst -C "$prefix" .
          tar --zstd --exclude=.git -cf /tmp/constitutive-bootstrap/workspace.tar.zst .
          (cd /tmp/constitutive-bootstrap && sha256sum *.tar.zst > SHA256SUMS)
          tar -cf /tmp/constitutive-bootstrap.tar -C /tmp/constitutive-bootstrap .
          split -b 200M -d -a 2 /tmp/constitutive-bootstrap.tar /tmp/constitutive-chunks/part
          ls -lh /tmp/constitutive-chunks/
      - uses: actions/upload-artifact@v4
        with:
          name: constitutive-bootstrap-00
          path: /tmp/constitutive-chunks/part00
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: constitutive-bootstrap-01
          path: /tmp/constitutive-chunks/part01
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: constitutive-bootstrap-02
          path: /tmp/constitutive-chunks/part02
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: constitutive-bootstrap-03
          path: /tmp/constitutive-chunks/part03
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: constitutive-bootstrap-04
          path: /tmp/constitutive-chunks/part04
          retention-days: 2
          compression-level: 0
          if-no-files-found: ignore
