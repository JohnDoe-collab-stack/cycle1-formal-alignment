name: Historical erasure verification

on:
  push:
    branches: ['research/noninvertible-historical-amplification']
  pull_request:
    paths:
      - 'ConstitutiveSearch/HistoricalErasure/**'
      - 'scripts/verify-historical-erasure.sh'
      - '.github/workflows/historical-erasure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build original project with pinned toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
      - name: Compile every extension module, execute regressions, verify constructive audits
        shell: bash
        run: bash scripts/verify-historical-erasure.sh
