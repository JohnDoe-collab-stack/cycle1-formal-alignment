name: Apply verified architecture refactor

on:
  push:
    branches:
      - research/mediated-transition-coherence
    paths:
      - .github/workflows/cycle1-refactor-audit.yml
      - scripts/refactor-cycle1.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Rehome modules by architectural ownership
        run: python3 scripts/refactor-cycle1.py relocate

      - name: Build after module relocation
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596

      - name: Check regressions after module relocation
        run: lake build AuditRegression

      - name: Rename historical iteration API
        run: |
          python3 scripts/refactor-cycle1.py rename-api
          lake build
          lake build AuditRegression

      - name: Update terminology and architectural target
        run: python3 scripts/refactor-cycle1.py documentation

      - name: Close residual narrative labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.md'): [
                  ('[Cycle 1]', '[Circular instance]'),
                  ('No `Alignment/*` or `Cycle1/*` module imports `RepresentationBoundary`.',
                   'No `Alignment/*` or `StrongPerimetralTurning/*Persistence` module imports `RepresentationBoundary`.'),
              ],
              Path('README_fr.md'): [
                  ('[Cycle 1]', '[Instance circulaire]'),
                  ("Aucun module `Alignment/*` ou `Cycle1/*` n'importe `RepresentationBoundary`.",
                   "Aucun module `Alignment/*` ou `StrongPerimetralTurning/*Persistence` n'importe `RepresentationBoundary`."),
              ],
              Path('audit/AUDIT_BUILD.txt'): [
                  ('No `Alignment/*` or `Cycle1/*` source imports `RepresentationBoundary`.',
                   'No `Alignment/*` or `StrongPerimetralTurning/*Persistence` source imports `RepresentationBoundary`.'),
              ],
              Path('docs/en/structural_foundations.md'): [
                  ('### 5.1 Cycle 1: exact circular alignment',
                   '### 5.1 Exact relative alignment of the circular instance'),
              ],
              Path('docs/fr/fondements_structurels.md'): [
                  ('### 5.1 Cycle 1 : alignement circulaire exact',
                   "### 5.1 Alignement relatif exact de l'instance circulaire"),
              ],
              Path('docs/en/verified_architecture_map.md'): [
                  ('Despite their current path under `Cycle1/`, these two modules are generic over',
                   'These two modules are generic over'),
              ],
              Path('docs/fr/cartographie_architecturale_verifiee.md'): [
                  ('Malgré leur chemin actuel sous `Cycle1/`, ces deux modules sont génériques sur',
                   'Ces deux modules sont génériques sur'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Refresh Lake metadata
        run: lake update

      - name: Refresh scientific manifest
        run: python3 scripts/refactor-cycle1.py manifest

      - name: Final verification
        run: |
          lake build
          lake build AuditRegression
          bash scripts/verify-manifest.sh
          rmdir Cycle1 2>/dev/null || true
          python3 scripts/refactor-cycle1.py verify

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Dissolve historical numbered architecture"
          git push origin HEAD:research/mediated-transition-coherence
