name: Apply verified architecture refactor

on:
  push:
    branches:
      - research/mediated-transition-coherence
    paths:
      - .github/workflows/cycle1-refactor-audit.yml
      - scripts/refactor-cycle1.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Rehome modules by architectural ownership
        run: python3 scripts/refactor-cycle1.py relocate

      - name: Build after module relocation
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596

      - name: Check regressions after module relocation
        run: lake build AuditRegression

      - name: Rename historical iteration API
        run: |
          python3 scripts/refactor-cycle1.py rename-api
          lake build
          lake build AuditRegression

      - name: Update terminology and architectural target
        run: python3 scripts/refactor-cycle1.py documentation

      - name: Refresh Lake metadata
        run: lake update

      - name: Refresh scientific manifest
        run: python3 scripts/refactor-cycle1.py manifest

      - name: Final verification
        run: |
          lake build
          lake build AuditRegression
          bash scripts/verify-manifest.sh
          python3 scripts/refactor-cycle1.py verify

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Dissolve historical numbered architecture"
          git push origin HEAD:research/mediated-transition-coherence
